<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Chemie Fabriek - Factorio Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #121316;
            color: #e1e2e6;
            overflow: hidden;
        }
        #game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #grid-container {
            flex-grow: 1;
            position: relative;
            background-color: #1a1c23;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            overflow: hidden;
        }
        
        /* Grid Cells */
        .grid-cell {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            transition: background-color 0.15s;
        }
        .grid-cell:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Entity Visual Classes */
        .conveyor, .conveyor-curve { 
            background-color: rgba(255, 255, 255, 0.05); 
            color: #fbc531;
            font-size: 22px;
            background-size: 20px 20px !important;
        }
        
        /* Striped moving backgrounds for conveyors */
        .conveyor.dir-0, .conveyor-curve.dir-0 { /* UP */
            background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px);
            animation: belt-up 0.5s linear infinite;
        }
        .conveyor.dir-1, .conveyor-curve.dir-1 { /* RIGHT */
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px);
            animation: belt-right 0.5s linear infinite;
        }
        .conveyor.dir-2, .conveyor-curve.dir-2 { /* DOWN */
            background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px);
            animation: belt-down 0.5s linear infinite;
        }
        .conveyor.dir-3, .conveyor-curve.dir-3 { /* LEFT */
            background-image: repeating-linear-gradient(270deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px);
            animation: belt-left 0.5s linear infinite;
        }

        @keyframes belt-up { from { background-position: 0 0; } to { background-position: 0 -20px; } }
        @keyframes belt-right { from { background-position: 0 0; } to { background-position: 20px 0; } }
        @keyframes belt-down { from { background-position: 0 0; } to { background-position: 0 20px; } }
        @keyframes belt-left { from { background-position: 0 0; } to { background-position: -20px 0; } }

        .source-h { background-color: rgba(72, 219, 251, 0.2); border: 2px solid #48dbfb; color: #48dbfb; }
        .source-o { background-color: rgba(255, 107, 107, 0.2); border: 2px solid #ff6b6b; color: #ff6b6b; }
        .source-c { background-color: rgba(200, 200, 200, 0.2); border: 2px solid #aaaaaa; color: #ffffff; }
        .source-n { background-color: rgba(165, 94, 234, 0.2); border: 2px solid #a55eea; color: #a55eea; }
        .source-s { background-color: rgba(254, 202, 87, 0.2); border: 2px solid #fecb57; color: #fecb57; }
        .source-cl { background-color: rgba(29, 209, 161, 0.2); border: 2px solid #1dd1a1; color: #1dd1a1; }
        
        .mixer { 
            background-color: rgba(32, 191, 107, 0.25); 
            border: 2px solid #20bf6b; 
            border-radius: 8px; 
            color: #20bf6b;
        }
        .inleverpunt { 
            background-color: rgba(247, 183, 49, 0.25); 
            border: 2px dashed #f7b731; 
            border-radius: 8px; 
            color: #f7b731;
        }
        
        /* Moving Items */
        .item {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: 800;
            color: #121316;
            z-index: 10;
            transition: all 0.35s linear;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* UI Sidebar */
        #ui-panel {
            width: 340px;
            background-color: #181a1f;
            border-left: 2px solid #282c34;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .btn-build {
            background-color: #22262e;
            color: #d1d5db;
            border: 1px solid #333842;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .btn-build:hover:not(:disabled) { 
            background-color: #2c323d; 
            border-color: #4f5b66;
        }
        .btn-build.selected { 
            background-color: #2563eb; 
            border-color: #3b82f6; 
            color: white; 
            font-weight: bold;
        }
        .btn-build:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
        }

        /* Custom Scrollbar for Sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #181a1f;
        }
        ::-webkit-scrollbar-thumb {
            background: #333842;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Grid Canvas -->
        <div id="grid-container"></div>

        <!-- Sidebar Dashboard -->
        <div id="ui-panel" class="p-4 flex flex-col h-full">
            <!-- Header & Level -->
            <div class="border-b border-gray-700 pb-3 mb-3">
                <div class="flex justify-between items-center mb-1">
                    <h1 class="text-xl font-black text-amber-400 tracking-wide">🏭 CHEM FABRIEK</h1>
                    <span id="level-badge" class="bg-amber-500/20 text-amber-300 text-xs px-2 py-0.5 rounded border border-amber-500/40 font-bold">Lvl 1</span>
                </div>
                <p id="level-title" class="text-xs text-gray-400">Basis Chemie (H₂O)</p>
            </div>

            <!-- Stats & Level Upgrade -->
            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 mb-4">
                <div class="text-xs text-gray-400 uppercase font-semibold">Saldo</div>
                <div class="text-2xl font-black text-green-400 mb-2" id="money-display">€ 1.000</div>
                
                <button id="btn-upgrade-level" onclick="upgradeLevel()" class="w-full py-2 px-3 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-bold text-xs rounded transition flex justify-between items-center shadow-lg">
                    <span>🚀 Herbouw Fabriek (Lvl <span id="next-level-num">2</span>)</span>
                    <span id="next-level-cost">€ 1.500</span>
                </button>
            </div>

            <!-- Scrollable Construction & Recipe Tabs -->
            <div class="flex-grow overflow-y-auto space-y-4 pr-1">
                <!-- Construction Section -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🔨 Gebouwen & Bronnen</h2>
                    <div class="space-y-1.5" id="build-buttons">
                        <!-- Buttons injected dynamically by JS -->
                    </div>
                </div>

                <!-- Recipe Book -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🧪 Recepten & Waarde</h2>
                    <div class="space-y-1.5" id="recipe-list">
                        <!-- Recipes injected dynamically by JS -->
                    </div>
                </div>
            </div>

            <!-- Footer / Controls Info -->
            <div class="mt-3 pt-3 border-t border-gray-800 text-[11px] text-gray-400 space-y-1">
                <p>💡 <b>Tip:</b> Klik op een geplaatste Lopende Band om de richting te draaien (⬆️ ➡️ ⬇️ ⬅️).</p>
                <p>⚙️ Mixers verwerken automatisch de meest waardevolle formules.</p>
            </div>
        </div>
    </div>

    <script>
        const CELL_SIZE = 50;
        let GRID_WIDTH = Math.floor((window.innerWidth - 340) / CELL_SIZE);
        let GRID_HEIGHT = Math.floor(window.innerHeight / CELL_SIZE);
        const TICK_RATE = 400; // ms per tick

        // Game State
        let money = 1000;
        let playerLevel = 1;
        let selectedTool = 'cursor';
        let toolPrice = 0;
        let currentBuildDir = 1; // 0=Up, 1=Right, 2=Down, 3=Left

        // Level config
        const LEVEL_CONFIG = {
            1: { title: "Basiselementen (H₂O)", costNext: 1500 },
            2: { title: "Organische Basis (CO₂, NH₃, CH₄)", costNext: 8000 },
            3: { title: "Zuren & Mineralen (HCl, SO₂, H₂SO₄)", costNext: 35000 },
            4: { title: "Industriële Synthese (Glucose)", costNext: null }
        };

        // Chemical Recipes
        const RECIPES = [
            { id: 'H2O', name: 'Water', formula: 'H₂O', req: { 'H': 2, 'O': 1 }, value: 60, lvl: 1, color: '#38ada9' },
            { id: 'CO2', name: 'Koolstofdioxide', formula: 'CO₂', req: { 'C': 1, 'O': 2 }, value: 150, lvl: 2, color: '#78e08f' },
            { id: 'NH3', name: 'Ammoniak', formula: 'NH₃', req: { 'N': 1, 'H': 3 }, value: 220, lvl: 2, color: '#f6b93b' },
            { id: 'CH4', name: 'Methaan', formula: 'CH₄', req: { 'C': 1, 'H': 4 }, value: 350, lvl: 2, color: '#e67e22' },
            { id: 'HCl', name: 'Zoutzuur', formula: 'HCl', req: { 'H': 1, 'Cl': 1 }, value: 180, lvl: 3, color: '#e55039' },
            { id: 'SO2', name: 'Zwaveldioxide', formula: 'SO₂', req: { 'S': 1, 'O': 2 }, value: 280, lvl: 3, color: '#4a69bd' },
            { id: 'H2SO4', name: 'Zwavelzuur', formula: 'H₂SO₄', req: { 'H': 2, 'S': 1, 'O': 4 }, value: 1500, lvl: 3, color: '#b8e994' },
            { id: 'C6H12O6', name: 'Glucose', formula: 'C₆H₁₂O₆', req: { 'C': 6, 'H': 12, 'O': 6 }, value: 8500, lvl: 4, color: '#f8c291' }
        ];

        // Raw Element Values (if sold unprocessed)
        const ELEMENT_VALUES = {
            'H': 2, 'O': 3, 'C': 5, 'N': 8, 'S': 12, 'Cl': 15
        };

        const ELEMENT_COLORS = {
            'H': '#48dbfb', 'O': '#ff6b6b', 'C': '#ffffff', 'N': '#a55eea', 'S': '#fecb57', 'Cl': '#1dd1a1'
        };

        // Available Buildings Definition
        const BUILDINGS = [
            { id: 'cursor', name: '🖱️ Muis (Deselecteren)', price: 0, lvl: 1 },
            { id: 'rotate', name: '🔄 Bouwrichting [Sneltoets: R]', price: 0, lvl: 1 },
            { id: 'conveyor', name: 'Lopende Band', price: 10, lvl: 1 },
            { id: 'conveyor-curve', name: 'Bocht Band', price: 15, lvl: 1 },
            { id: 'source-h', name: '💧 H-Bron (Waterstof)', price: 100, lvl: 1 },
            { id: 'source-o', name: '🔥 O-Bron (Zuurstof)', price: 150, lvl: 1 },
            { id: 'mixer', name: '🧪 Chemische Mixer', price: 300, lvl: 1 },
            { id: 'inleverpunt', name: '🏢 Inleverpunt (Verkoop)', price: 100, lvl: 1 },
            
            { id: 'source-c', name: '🪨 C-Bron (Koolstof)', price: 400, lvl: 2 },
            { id: 'source-n', name: '💨 N-Bron (Stikstof)', price: 500, lvl: 2 },
            
            { id: 'source-s', name: '🟡 S-Bron (Zwavel)', price: 800, lvl: 3 },
            { id: 'source-cl', name: '🧪 Cl-Bron (Chloor)', price: 1000, lvl: 3 },
            
            { id: 'delete', name: '🗑️ Delete', price: 0, lvl: 1 }
        ];

        // Grid & Entities Store
        const grid = {}; // "x,y" => { type, dir, obj, inventory: {} }
        let items = []; // Array of item objects
        let itemIdCounter = 0;

        const DIRS = [ {dx: 0, dy: -1}, {dx: 1, dy: 0}, {dx: 0, dy: 1}, {dx: -1, dy: 0} ];
        const DIR_ARROWS = ['⬆️', '➡️', '⬇️', '⬅️'];
        const CURVE_ARROWS = ['↱', '↴', '↲', '↰'];

        const gridContainer = document.getElementById('grid-container');

        function initGrid() {
            gridContainer.innerHTML = '';
            for(let x = 0; x < GRID_WIDTH; x++) {
                for(let y = 0; y < GRID_HEIGHT; y++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.style.left = `${x * CELL_SIZE}px`;
                    cell.style.top = `${y * CELL_SIZE}px`;
                    cell.onclick = () => handleGridClick(x, y);
                    gridContainer.appendChild(cell);
                }
            }
        }

        function updateUI() {
            // Money & Level Badges
            document.getElementById('money-display').innerText = `€ ${money.toLocaleString('nl-NL')}`;
            document.getElementById('level-badge').innerText = `Lvl ${playerLevel}`;
            document.getElementById('level-title').innerText = LEVEL_CONFIG[playerLevel].title;

            const nextLvl = playerLevel + 1;
            const upgradeBtn = document.getElementById('btn-upgrade-level');
            if (LEVEL_CONFIG[playerLevel].costNext) {
                upgradeBtn.style.display = 'flex';
                document.getElementById('next-level-num').innerText = nextLvl;
                document.getElementById('next-level-cost').innerText = `€ ${LEVEL_CONFIG[playerLevel].costNext.toLocaleString('nl-NL')}`;
            } else {
                upgradeBtn.style.display = 'none';
            }

            // Render Available Buildings
            const btnContainer = document.getElementById('build-buttons');
            btnContainer.innerHTML = '';
            
            BUILDINGS.filter(b => b.lvl <= playerLevel).forEach(b => {
                const btn = document.createElement('button');
                
                const isSelected = selectedTool === b.id;
                btn.className = `btn-build w-full ${isSelected ? 'selected' : ''}`;
                btn.onclick = () => selectTool(b.id, b.price);
                
                let displayName = b.name;
                if (b.id === 'conveyor') displayName = `${DIR_ARROWS[currentBuildDir]} ${b.name}`;
                if (b.id === 'conveyor-curve') displayName = `${CURVE_ARROWS[currentBuildDir]} ${b.name}`;
                if (b.id === 'rotate') displayName = `🔄 Richting (${DIR_ARROWS[currentBuildDir]}) [R]`;

                btn.innerHTML = `
                    <span>${displayName}</span>
                    <span class="text-xs ${b.price === 0 ? 'text-red-400' : 'text-gray-400'}">${b.price > 0 ? '€' + b.price : ''}</span>
                `;
                btnContainer.appendChild(btn);
            });

            // Render Recipe Book
            const recipeContainer = document.getElementById('recipe-list');
            recipeContainer.innerHTML = '';

            RECIPES.forEach(r => {
                const unlocked = r.lvl <= playerLevel;
                const reqStr = Object.entries(r.req).map(([el, cnt]) => `${cnt}x ${el}`).join(', ');
                
                const card = document.createElement('div');
                card.className = `p-2 rounded border text-xs flex justify-between items-center ${unlocked ? 'bg-gray-800/60 border-gray-700' : 'bg-gray-900/30 border-gray-800 opacity-40'}`;
                card.innerHTML = `
                    <div>
                        <div class="font-bold" style="color: ${unlocked ? r.color : '#888'}">${r.formula} - ${r.name}</div>
                        <div class="text-[10px] text-gray-400">${unlocked ? 'Nodig: ' + reqStr : 'Vereist Lvl ' + r.lvl}</div>
                    </div>
                    <div class="font-black ${unlocked ? 'text-green-400' : 'text-gray-500'}">€${r.value}</div>
                `;
                recipeContainer.appendChild(card);
            });
        }

        function selectTool(toolId, price) {
            if (toolId === 'rotate') {
                currentBuildDir = (currentBuildDir + 1) % 4;
                updateUI();
                return; // Verander niet van gereedschap!
            }
            selectedTool = toolId;
            toolPrice = price;
            updateUI();
        }

        function handleGridClick(x, y) {
            const key = `${x},${y}`;

            if (selectedTool === 'delete') {
                if (grid[key]) {
                    // Krijg 80% van het aankoopbedrag terug!
                    const buildingDef = BUILDINGS.find(b => b.id === grid[key].type);
                    if (buildingDef && buildingDef.price > 0) {
                        money += Math.floor(buildingDef.price * 0.8);
                        updateUI();
                    }

                    if (grid[key].obj.parentNode) {
                        gridContainer.removeChild(grid[key].obj);
                    }
                    delete grid[key];

                    // Verwijder ook atomen/items die toevallig op dit blokje stonden
                    const itemsToDelete = items.filter(i => i.x === x && i.y === y);
                    itemsToDelete.forEach(item => {
                        if (item.visual.parentNode) item.visual.parentNode.removeChild(item.visual);
                        const idx = items.indexOf(item);
                        if (idx > -1) items.splice(idx, 1);
                    });
                }
                return;
            }

            // Draai de lopende band als je erop klikt (tenzij we hem overschrijven met een heel ander gebouw)
            if (grid[key] && (grid[key].type === 'conveyor' || grid[key].type === 'conveyor-curve')) {
                // We roteren alleen als we de Muis gebruiken OF exact hetzelfde type band geselecteerd hebben
                if (selectedTool === 'cursor' || selectedTool === grid[key].type) {
                    grid[key].obj.classList.remove(`dir-${grid[key].dir}`);
                    grid[key].dir = (grid[key].dir + 1) % 4;
                    grid[key].obj.classList.add(`dir-${grid[key].dir}`);
                    grid[key].obj.innerText = grid[key].type === 'conveyor' ? DIR_ARROWS[grid[key].dir] : CURVE_ARROWS[grid[key].dir];
                    return;
                }
            }

            // Muis klikt op leeg vakje of we willen niks bouwen: doe niets
            if (selectedTool === 'cursor') return;

            // Vervangingslogica (als er al iets staat)
            if (grid[key]) {
                // Voorkom dat je per ongeluk exact hetzelfde gebouw over zichzelf heen plaatst en geld verliest
                if (grid[key].type === selectedTool) return;

                if (money < toolPrice) {
                    showFloatingText(key, "Niet genoeg geld!", "#ff6b6b");
                    return;
                }

                // Verkoop het oude gebouw (80% retour)
                const buildingDef = BUILDINGS.find(b => b.id === grid[key].type);
                if (buildingDef && buildingDef.price > 0) {
                    money += Math.floor(buildingDef.price * 0.8);
                }

                // Verwijder oud gebouw uit de DOM en grid
                if (grid[key].obj.parentNode) {
                    gridContainer.removeChild(grid[key].obj);
                }
                delete grid[key];

                // Verwijder eventuele items die er nog lagen
                const itemsToDelete = items.filter(i => i.x === x && i.y === y);
                itemsToDelete.forEach(item => {
                    if (item.visual.parentNode) item.visual.parentNode.removeChild(item.visual);
                    const idx = items.indexOf(item);
                    if (idx > -1) items.splice(idx, 1);
                });
            } else {
                // Leeg vakje, check alleen of we genoeg geld hebben
                if (money < toolPrice) {
                    showFloatingText(key, "Niet genoeg geld!", "#ff6b6b");
                    return;
                }
            }

            // Deduct funds
            money -= toolPrice;
            updateUI();

            // Build Entity
            buildEntity(x, y, selectedTool);
        }

        function buildEntity(x, y, type) {
            const key = `${x},${y}`;
            const el = document.createElement('div');
            el.className = `grid-cell ${type}`;
            el.style.left = `${x * CELL_SIZE}px`;
            el.style.top = `${y * CELL_SIZE}px`;

            let dir = currentBuildDir; // Gebruik de vooraf ingestelde bouwrichting!

            if (type === 'conveyor') {
                el.innerText = DIR_ARROWS[dir];
                el.classList.add(`dir-${dir}`);
            } else if (type === 'conveyor-curve') {
                el.innerText = CURVE_ARROWS[dir];
                el.classList.add(`dir-${dir}`);
            } else if (type.startsWith('source-')) {
                const elem = type.replace('source-', '').toUpperCase();
                el.innerText = elem;
            } else if (type === 'mixer') {
                el.innerText = '🧪';
            } else if (type === 'inleverpunt') {
                el.innerText = '🏢';
            }

            grid[key] = { 
                type, 
                dir, 
                obj: el, 
                inventory: {} 
            };
            gridContainer.appendChild(el);
        }

        function spawnItem(type, x, y) {
            const id = itemIdCounter++;
            const el = document.createElement('div');
            el.className = 'item';
            el.innerText = type;
            
            // Item styling
            const color = ELEMENT_COLORS[type] || RECIPES.find(r => r.id === type)?.color || '#20bf6b';
            el.style.backgroundColor = color;
            if (type.length > 3) el.style.fontSize = '8px';

            updateVisualPosition(el, x, y);
            gridContainer.appendChild(el);

            items.push({
                id,
                type,
                x,
                y,
                visual: el,
                movedThisTick: false
            });
        }

        function updateVisualPosition(element, x, y) {
            element.style.left = `${(x * CELL_SIZE) + 13}px`;
            element.style.top = `${(y * CELL_SIZE) + 13}px`;
        }

        function gameTick() {
            // 1. Spawners produce elements (spawn op de bron zelf)
            for (const key in grid) {
                const entity = grid[key];
                if (entity.type.startsWith('source-')) {
                    const [x, y] = key.split(',').map(Number);
                    const elemType = entity.type.replace('source-', '').toUpperCase();
                    
                    // Spawn een atoom als er nog geen op de bron staat
                    const hasItem = items.find(i => i.x === x && i.y === y);
                    if (!hasItem) {
                        spawnItem(elemType, x, y);
                    }
                }
            }

            // Reset movement flag
            items.forEach(i => i.movedThisTick = false);

            // 2. Transport & Push logica (Bronnen duwen atomen het systeem in)
            const itemsToRemove = [];

            items.forEach(item => {
                if (item.movedThisTick) return;

                const currentKey = `${item.x},${item.y}`;
                const currentCell = grid[currentKey];

                if (currentCell) {
                    let moveDirs = [];
                    
                    // Bepaal in welke richtingen het item mag proberen te bewegen
                    if (currentCell.type.startsWith('conveyor')) {
                        moveDirs = [ DIRS[currentCell.dir] ]; // Lopende banden gaan maar 1 kant op
                    } else if (currentCell.type.startsWith('source-')) {
                        moveDirs = DIRS; // Bronnen proberen hun atoom naar alle 4 de buren te duwen
                    }

                    for (const dirVec of moveDirs) {
                        const nextX = item.x + dirVec.dx;
                        const nextY = item.y + dirVec.dy;
                        const nextKey = `${nextX},${nextY}`;
                        const nextCell = grid[nextKey];

                        if (nextX >= 0 && nextX < GRID_WIDTH && nextY >= 0 && nextY < GRID_HEIGHT) {
                            // Check of het doel een band, mixer of inleverpunt is
                            if (nextCell && (nextCell.type.startsWith('conveyor') || nextCell.type === 'mixer' || nextCell.type === 'inleverpunt')) {
                                
                                const blockingItem = items.find(i => i.x === nextX && i.y === nextY);
                                
                                if (!blockingItem) {
                                    item.x = nextX;
                                    item.y = nextY;
                                    updateVisualPosition(item.visual, item.x, item.y);
                                    item.movedThisTick = true;

                                    // Als hij op een machine landt, wordt hij geconsumeerd
                                    if (nextCell.type === 'mixer') {
                                        nextCell.inventory[item.type] = (nextCell.inventory[item.type] || 0) + 1;
                                        itemsToRemove.push(item);
                                    } else if (nextCell.type === 'inleverpunt') {
                                        // Verkoop het item
                                        let value = ELEMENT_VALUES[item.type] || 0;
                                        const rec = RECIPES.find(r => r.id === item.type);
                                        if (rec) value = rec.value;

                                        money += value;
                                        updateUI();
                                        showFloatingText(nextKey, `+€${value}`, "#20bf6b");
                                        itemsToRemove.push(item);
                                    }
                                    
                                    break; // Succesvol bewogen, stop met het controleren van andere richtingen
                                }
                            }
                        }
                    }
                }
            });

            // 3. Process Chemical Mixers (Auto Synthesis & Output)
            for (const key in grid) {
                const entity = grid[key];
                if (entity.type === 'mixer') {
                    // Zoek het duurste recept dat gemaakt kan worden
                    const availableRecipes = RECIPES.filter(r => r.lvl <= playerLevel)
                        .sort((a, b) => b.value - a.value);

                    for (const recipe of availableRecipes) {
                        let canMake = true;
                        for (const [elem, count] of Object.entries(recipe.req)) {
                            if ((entity.inventory[elem] || 0) < count) {
                                canMake = false;
                                break;
                            }
                        }

                        if (canMake) {
                            const [mx, my] = key.split(',').map(Number);
                            let outputTarget = null;

                            // Zoek naar een aangesloten uitvoer-plek
                            for (const dir of DIRS) {
                                const tx = mx + dir.dx;
                                const ty = my + dir.dy;
                                const targetCell = grid[`${tx},${ty}`];

                                if (targetCell && (targetCell.type.startsWith('conveyor') || targetCell.type === 'inleverpunt' || targetCell.type === 'mixer')) {
                                    const blockingItem = items.find(i => i.x === tx && i.y === ty);
                                    if (!blockingItem) {
                                        outputTarget = { x: tx, y: ty };
                                        break;
                                    }
                                }
                            }

                            if (outputTarget) {
                                // Verbruik grondstoffen
                                for (const [elem, count] of Object.entries(recipe.req)) {
                                    entity.inventory[elem] -= count;
                                }
                                
                                const targetCell = grid[`${outputTarget.x},${outputTarget.y}`];
                                
                                // Bepaal wat te doen met het eindproduct
                                if (targetCell.type === 'inleverpunt') {
                                    money += recipe.value;
                                    updateUI();
                                    showFloatingText(`${outputTarget.x},${outputTarget.y}`, `+€${recipe.value}`, "#20bf6b");
                                } else if (targetCell.type === 'mixer') {
                                    // Pomp het direct in de volgende fabriek
                                    targetCell.inventory[recipe.id] = (targetCell.inventory[recipe.id] || 0) + 1;
                                    showFloatingText(`${outputTarget.x},${outputTarget.y}`, `+${recipe.id}`, recipe.color);
                                } else {
                                    // Leg het product op de lopende band
                                    spawnItem(recipe.id, outputTarget.x, outputTarget.y);
                                }
                                
                                showFloatingText(key, `🧪 ${recipe.formula}`, recipe.color);
                                break; // Max 1 recept per tik
                            }
                        }
                    }
                }
            }

            // Verwijder items die geconsumeerd of verkocht zijn
            itemsToRemove.forEach(item => {
                if (item.visual.parentNode) item.visual.parentNode.removeChild(item.visual);
                const idx = items.indexOf(item);
                if (idx > -1) items.splice(idx, 1);
            });
        }

        function upgradeLevel() {
            const cost = LEVEL_CONFIG[playerLevel].costNext;
            if (!cost) return;

            if (money >= cost) {
                money -= cost;
                playerLevel++;
                
                // Clear grid for fresh layout
                for (const key in grid) {
                    if (grid[key].obj.parentNode) grid[key].obj.parentNode.removeChild(grid[key].obj);
                }
                for (const key in grid) delete grid[key];

                items.forEach(i => { if (i.visual.parentNode) i.visual.parentNode.removeChild(i.visual); });
                items = [];

                // Re-place default Inleverpunt
                const hubX = Math.floor(GRID_WIDTH / 2);
                const hubY = Math.floor(GRID_HEIGHT / 2);
                buildEntity(hubX, hubY, 'inleverpunt');

                updateUI();
                showFloatingText(`${hubX},${hubY}`, `🚀 FABRIEK HERBOUWD (LVL ${playerLevel})`, "#f7b731");
            } else {
                alert(`Je hebt € ${cost.toLocaleString('nl-NL')} nodig om de fabriek te herbouwen naar Level ${playerLevel + 1}!`);
            }
        }

        function showFloatingText(gridKey, text, color) {
            const [x, y] = gridKey.split(',').map(Number);
            const el = document.createElement('div');
            el.innerText = text;
            el.style.position = 'absolute';
            el.style.left = `${(x * CELL_SIZE)}px`;
            el.style.top = `${(y * CELL_SIZE) - 10}px`;
            el.style.color = color;
            el.style.fontWeight = '900';
            el.style.fontSize = '12px';
            el.style.zIndex = '60';
            el.style.pointerEvents = 'none';
            el.style.transition = 'all 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
            gridContainer.appendChild(el);

            setTimeout(() => {
                el.style.top = `${(y * CELL_SIZE) - 35}px`;
                el.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 850);
        }

        // Start Loop & Setup
        window.addEventListener('resize', () => {
            GRID_WIDTH = Math.floor((window.innerWidth - 340) / CELL_SIZE);
            GRID_HEIGHT = Math.floor(window.innerHeight / CELL_SIZE);
            initGrid();
        });

        // Sneltoetsen
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                selectTool('rotate', 0);
            }
        });

        initGrid();
        updateUI();

        // Place initial delivery hub in center
        const startX = Math.floor(GRID_WIDTH / 2);
        const startY = Math.floor(GRID_HEIGHT / 2);
        buildEntity(startX, startY, 'inleverpunt');

        setInterval(gameTick, TICK_RATE);
    </script>
</body>
</html>
