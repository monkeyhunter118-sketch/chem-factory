<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Chemie Fabriek - Factorio Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Grid Canvas -->
        <div id="grid-container"></div>

        <!-- Sidebar Dashboard -->
        <div id="ui-panel" class="p-4 flex flex-col h-full">
            <!-- Header & Level -->
            <div class="border-b border-gray-700 pb-3 mb-3">
                <div class="flex justify-between items-center mb-1">
                    <h1 class="text-xl font-black text-amber-400 tracking-wide">🏭 CHEM FABRIEK</h1>
                    <span id="level-badge" class="bg-amber-500/20 text-amber-300 text-xs px-2 py-0.5 rounded border border-amber-500/40 font-bold">Lvl 1</span>
                </div>
                <p id="level-title" class="text-xs text-gray-400">Basis Chemie (H₂O)</p>
            </div>

            <!-- Stats & Level Upgrade -->
            <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 mb-4">
                <div class="text-xs text-gray-400 uppercase font-semibold">Saldo</div>
                <div class="text-2xl font-black text-green-400 mb-2" id="money-display">€ 1.000</div>
                
                <button id="btn-upgrade-level" onclick="upgradeLevel()" class="w-full py-2 px-3 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-bold text-xs rounded transition flex justify-between items-center shadow-lg">
                    <span>🚀 Herbouw Fabriek (Lvl <span id="next-level-num">2</span>)</span>
                    <span id="next-level-cost">€ 1.500</span>
                </button>
            </div>

            <!-- Scrollable Construction & Recipe Tabs -->
            <div class="flex-grow overflow-y-auto space-y-4 pr-1">
                <!-- Construction Section -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🔨 Gebouwen & Bronnen</h2>
                    <div class="space-y-1.5" id="build-buttons">
                        <!-- Buttons injected dynamically by JS -->
                    </div>
                </div>

                <!-- Recipe Book -->
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">🧪 Recepten & Waarde</h2>
                    <div class="space-y-1.5" id="recipe-list">
                        <!-- Recipes injected dynamically by JS -->
                    </div>
                </div>
            </div>

            <!-- Footer / Controls Info -->
            <div class="mt-3 pt-3 border-t border-gray-800 text-[11px] text-gray-400 space-y-1">
                <p>💡 <b>Tip:</b> Klik op een geplaatste Lopende Band om de richting te draaien (⬆️ ➡️ ⬇️ ⬅️).</p>
                <p>⚙️ Mixers verwerken automatisch de meest waardevolle formules.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
